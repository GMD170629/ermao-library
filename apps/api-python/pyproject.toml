[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ermao-books-api-python"
version = "1.0.0"
description = "Python FastAPI backend for 二毛图书"
requires-python = "==3.11.*"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "Pillow>=11.3.0",
  "ebooklib>=0.18",
  "html5lib>=1.1",
  "lxml>=5.2.0",
  "mutagen>=1.47.0",
  "pypdfium2>=4.30.0",
  "pypdf>=5.7.0",
  "rarfile>=4.4",
  "python-multipart>=0.0.20",
  "watchdog>=4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "mypy>=2.3.1",
  "ruff>=0.16.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["alembic.ini", "alembic/**/*.py", "alembic/**/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--capture=tee-sys"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]
