// Opt-in RG-03/04 device UI acceptance only. This does not build a deliverable.
// Keep the normal release source set (empty login defaults), but install into
// a separate Android UID so MainActivity can run without touching user data.
gradle.beforeProject { project ->
    if (project.path == ':androidApp') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.applicationId = 'com.ermao.library.releasecheck'
                android.testBuildType = 'release'
                if (project.providers.gradleProperty('enableReleaseLiveProbe').orNull == 'true') {
                    // This separate opt-in APK contains only the live gate. The normal
                    // debug instrumentation suite depends on debug-only visual hosts.
                    def liveSources = android.sourceSets.getByName('androidTest').kotlin.directories
                    liveSources.clear()
                    liveSources.add(project.rootProject.file('test-support/release-live/androidTest').absolutePath)
                    // Reuse the normal Compose test host in this isolated development APK.
                    def libs = project.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
                    project.dependencies.add('releaseImplementation', libs.findLibrary('androidx-compose-ui-test-manifest').get())
                }
                def acceptanceBuild = android.buildTypes.getByName('release')
                acceptanceBuild.signingConfig = android.signingConfigs.getByName('debug')
                acceptanceBuild.debuggable = true
            }
        }
    }
}
