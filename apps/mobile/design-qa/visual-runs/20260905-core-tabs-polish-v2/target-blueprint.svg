<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#17191d}.title{font-size:24px;font-weight:700}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#77736f}.orange{fill:#ff4f2a}.frame{fill:#fbfaf8;stroke:#e6e1db}.line{stroke:#e6e1db}.icon{stroke:#77736f;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="660" fill="#f3f1ee"/><text x="30" y="44" class="title">核心页面细节 · v2 目标蓝图</text><text x="30" y="72" class="note">布局与尺寸示意；由本轮反馈确定。颜色继续使用契约 1.2.0，保留主体内容与现有操作。</text>
<g transform="translate(30 110)"><rect width="550" height="210" rx="16" class="frame"/><text x="20" y="35" class="label">底部导航：内部留白 + 连续手势区</text><rect x="20" y="65" width="510" height="92" fill="#f3f1ee"/><rect x="25" y="70" width="117" height="62" rx="16" fill="#fce6df"/><text x="73" y="95" class="orange">⌂</text><text x="69" y="120" class="orange">首页</text><text x="196" y="115" class="note">书库</text><text x="325" y="115" class="note">书架</text><text x="452" y="115" class="note">我的</text><rect x="227" y="145" width="96" height="4" rx="2" fill="#17191d"/><text x="20" y="188" class="note">背景内上下 ≥6dp；外侧左右对称；导航到屏幕底边同为 navigation</text></g>
<g transform="translate(610 110)"><rect width="560" height="210" rx="16" class="frame"/><text x="20" y="35" class="label">设置列表过滤：与子页共享 Tab</text><text x="177" y="79" class="label">Kindle 发送队列</text><text x="85" y="120" class="orange">全部</text><text x="255" y="120" class="note">进行中</text><text x="442" y="120" class="note">失败</text><line x1="20" y1="139" x2="540" y2="139" class="line"/><rect x="20" y="136" width="174" height="3" fill="#ff4f2a"/><text x="20" y="188" class="note">固定在顶栏下方；等宽、48dp 最低触控高度；字段枚举保留分段</text></g>
<g transform="translate(30 346)"><rect width="550" height="265" rx="16" class="frame"/><text x="20" y="35" class="label">卷册工具栏：一行入口，完整路径可展开</text><rect x="20" y="57" width="510" height="62" rx="12" fill="#fffdfa"/><text x="35" y="80" class="note">共 30 项</text><text x="35" y="104" class="label">当前目录的完整名称…</text><path d="m310 86 7 7 7-7" class="icon"/><rect x="387" y="76" width="10" height="10" rx="1" class="icon"/><rect x="403" y="76" width="10" height="10" rx="1" class="icon"/><rect x="387" y="92" width="10" height="10" rx="1" class="icon"/><rect x="403" y="92" width="10" height="10" rx="1" class="icon"/><path d="M463 79h33m-28 9h23m-17 9h11" class="icon"/><text x="20" y="151" class="note">左侧弹性宽度；右侧图标24dp / 点击48dp；名称与两个按钮同排</text><rect x="20" y="170" width="510" height="71" rx="16" fill="#fff" stroke="#e6e1db"/><text x="35" y="195" class="note">展开路径 Sheet</text><text x="35" y="224" class="note">图书根目录 → 上级目录 → 当前目录（完整换行，点击可选择）</text></g>
<g transform="translate(610 346)"><rect width="560" height="265" rx="16" class="frame"/><text x="20" y="35" class="label">图书 / 目录 / 卷册菜单：紧凑统一</text><rect x="25" y="54" width="224" height="179" rx="16" fill="#fff" stroke="#e6e1db"/><text x="37" y="83" class="note">长书名在菜单内换行</text><text x="37" y="123" class="label">编辑</text><text x="37" y="169" class="label">上传封面</text><text x="37" y="214" class="orange">删除</text><text x="278" y="91" class="note">最大宽度 224dp</text><text x="278" y="124" class="note">圆角 task = 16dp</text><text x="278" y="157" class="note">左右内边距 12dp</text><text x="278" y="190" class="note">行高 ≥48dp，图标槽 24dp</text><text x="278" y="223" class="note">保留 Material Popup 行为</text></g>
<text x="30" y="641" class="note">最终验收：同一真机、最终 APK、同状态原图、菜单与路径交互、主审 + 独立评审。所有操作保持业务语义。</text></svg>
