<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="900" viewBox="0 0 1380 900">
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#17191d}.title{font-size:24px;font-weight:700}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#77736f}.line{stroke:#d8d1c9;stroke-width:1}.fill{fill:#fffdFA;stroke:#e6e1db}.orange{fill:#ff4f2a}.white{fill:#fff}.phone{fill:#fbfaf8;stroke:#d8d1c9;stroke-width:2}</style>
<rect width="1380" height="900" fill="#f3f1ee"/><text x="32" y="43" class="title">核心页面精修 · 已批准目标 v1</text><text x="32" y="70" class="note">结构示意，不是产品截图。保留分区与功能；平台负责系统外壳。中文 / 默认字号 / 竖屏</text>
<g transform="translate(32 104)"><rect width="294" height="646" rx="18" class="phone"/><text x="16" y="50" class="title">首页</text><text x="16" y="87" class="label">继续阅读</text><rect x="16" y="100" width="262" height="180" rx="16" class="fill"/><rect x="28" y="112" width="66" height="99" rx="8" fill="#e6e1db"/><text x="106" y="138" class="label">当前图书</text><text x="106" y="162" class="note">进度 / 最近阅读</text><rect x="28" y="233" width="238" height="34" rx="12" class="orange"/><text x="113" y="256" class="white label">继续阅读</text><text x="16" y="319" class="label">最近阅读</text><rect x="16" y="336" width="48" height="72" rx="8" fill="#e6e1db"/><text x="78" y="361" class="label">单条使用已有横向书目</text><text x="78" y="385" class="note">64dp 封面，不删除重复数据</text><text x="16" y="449" class="label">最近入库</text><g fill="#e6e1db"><rect x="16" y="467" width="79" height="110" rx="8"/><rect x="107" y="467" width="79" height="110" rx="8"/><rect x="199" y="467" width="79" height="110" rx="8"/></g><rect x="1" y="595" width="292" height="50" rx="12" fill="#f3f1ee"/><text x="20" y="625" class="note">首页　　　书库　　　书架　　　我的</text></g>
<g transform="translate(358 104)"><rect width="294" height="646" rx="18" class="phone"/><text x="16" y="44" class="label">←　　　目录型详情</text><rect x="112" y="64" width="72" height="108" rx="12" fill="#e6e1db"/><text x="49" y="194" class="label">封面 96dp × 144dp</text><text x="73" y="218" class="note">身份区间距 8dp</text><rect x="16" y="241" width="262" height="36" rx="12" class="orange"/><text x="115" y="266" class="white label">开始阅读</text><text x="22" y="314" class="note">下载　　　状态　　　加入　　　更多</text><text x="16" y="352" class="note">数量　　　　　　视图 / 排序</text><text x="16" y="382" class="note">目录路径：保留原有导航</text><g fill="#e6e1db"><rect x="16" y="400" width="79" height="119" rx="8"/><rect x="107" y="400" width="79" height="119" rx="8"/><rect x="199" y="400" width="79" height="119" rx="8"/></g><text x="16" y="543" class="note">子项名称</text><text x="107" y="543" class="note">最多三行</text><text x="199" y="543" class="note">格式独立</text><rect x="1" y="595" width="292" height="50" rx="12" fill="#f3f1ee"/><text x="20" y="625" class="note">首屏能辨认至少一个子项标题</text></g>
<g transform="translate(684 104)"><rect width="294" height="646" rx="18" class="phone"/><text x="16" y="44" class="label">←　　　设置　　　　保存</text><text x="52" y="84" class="label">Kindle　　　　SMTP</text><line x1="0" y1="100" x2="294" y2="100" class="line"/><text x="16" y="132" class="label">连接</text><rect x="16" y="148" width="262" height="46" rx="12" class="fill"/><text x="30" y="177" class="note">主机：统一文字起点</text><rect x="16" y="206" width="262" height="46" rx="12" class="fill"/><text x="30" y="234" class="note">端口：同样左对齐</text><rect x="16" y="268" width="262" height="40" rx="12" class="fill"/><rect x="103" y="268" width="88" height="40" fill="#fce6df"/><text x="33" y="294" class="note">无</text><text x="113" y="294" style="font-size:13px;fill:#ff4f2a">STARTTLS</text><text x="228" y="294" class="note">TLS</text><text x="16" y="349" class="label">发件身份</text><rect x="16" y="365" width="262" height="46" rx="12" class="fill"/><text x="30" y="393" class="note">邮箱 / 用户名 / 显示名称</text><rect x="16" y="423" width="262" height="46" rx="12" class="fill"/><text x="30" y="451" class="note">密码　　　　　　　　◉</text><text x="16" y="509" class="label">发送限制</text><rect x="16" y="525" width="262" height="46" rx="12" class="fill"/><text x="30" y="553" class="note">附件大小</text><text x="92" y="611" class="note">测试操作留在末尾</text></g>
<g transform="translate(1010 104)"><text y="25" class="label">细节门禁</text><text y="58" class="note">输入框：同一 12dp 圆角 owner</text><text y="84" class="note">主按钮：#FF4F2A / 白字</text><text y="110" class="note">菜单内边距：左 12dp = 右 12dp</text><text y="136" class="note">菜单行：至少 48dp；图标槽 24dp</text><rect x="0" y="167" width="320" height="156" rx="16" class="fill"/><text x="16" y="198" class="note">Material Popup / 共享组件</text><text x="16" y="234" class="label">名称 A–Z　　　　　　　　　✓</text><text x="16" y="280" class="label">最近更新　　　　　　　　　□</text><text y="359" class="note">尾部空槽与勾选槽同宽</text><text y="385" class="note">切换选中状态，文字不横向跳动</text><text y="428" class="label">书库与稳定页面</text><text y="459" class="note">统计上下各 8dp；三列保持</text><text y="485" class="note">书名两行；空作者不占行</text><text y="511" class="note">书架 / 我的保留行布局与分组</text><text y="554" class="label">不扩大本轮目标</text><text y="585" class="note">不改 Reader / 业务 / iOS 布局</text><text y="611" class="note">不做对比度、大字体、TalkBack 专项</text></g>
<text x="32" y="808" class="label">验收：同一真机 + 当前 APK + 完整页面截图 + 菜单/输入状态 + 独立复核</text><text x="32" y="840" class="note">原始截图与含账号的数据留在本地私有目录；本蓝图不包含真实书目、账户、邮件地址或服务器数据。</text></svg>
