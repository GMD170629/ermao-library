name: Mobile Stage 1

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/reader-contracts/**'
      - 'packages/reader-core/**'
      - 'packages/design-contracts/**'
      - 'apps/web/generated/visual-tokens.*'
      - 'docs/mobile-reader-architecture.md'
      - 'AGENTS.md'
      - '.cursor/rules/architecture.mdc'
      - 'apps/api-python/app/api/router.py'
      - 'apps/api-python/app/bootstrap/auth.py'
      - 'apps/api-python/app/contracts/http.py'
      - 'apps/api-python/app/contracts/http_errors.py'
      - 'apps/api-python/app/core/auth.py'
      - 'apps/api-python/app/core/authorization.py'
      - 'apps/api-python/app/db/seed.py'
      - 'apps/api-python/app/models/auth.py'
      - 'apps/api-python/app/modules/auth/**'
      - 'apps/api-python/app/modules/mobile/**'
      - 'apps/api-python/tests/contract/api/test_mobile_auth_contract.py'
      - 'apps/api-python/tests/contract/api/test_mobile_compatibility.py'
      - 'apps/api-python/tests/integration/modules/mobile/**'
      - 'apps/api-python/tests/test_route_coverage.py'
      - 'apps/api-python/tests/test_sqlite_database.py'
      - 'docs/adr/0006-native-mobile-kmp-boundaries.md'
      - 'docs/adr/0015-mobile-v1-verified-session-without-offline-mode.md'
      - 'docs/testing/test-execution-policy.md'
      - 'docs/manual-acceptance.md'
      - '.github/workflows/mobile.yml'
      - 'scripts/*android-beta*'
      - 'apps/web/public/brand/ermao-library-app-icon-v1.png'
      - 'apps/web/public/fonts/reader/android-legacy/**'
  push:
    branches:
      - develop
      - prod
    paths:
      - 'apps/mobile/**'
      - 'packages/reader-contracts/**'
      - 'packages/reader-core/**'
      - 'packages/design-contracts/**'
      - 'apps/web/generated/visual-tokens.*'
      - 'docs/mobile-reader-architecture.md'
      - 'AGENTS.md'
      - '.cursor/rules/architecture.mdc'
      - 'apps/api-python/app/api/router.py'
      - 'apps/api-python/app/bootstrap/auth.py'
      - 'apps/api-python/app/contracts/http.py'
      - 'apps/api-python/app/contracts/http_errors.py'
      - 'apps/api-python/app/core/auth.py'
      - 'apps/api-python/app/core/authorization.py'
      - 'apps/api-python/app/db/seed.py'
      - 'apps/api-python/app/models/auth.py'
      - 'apps/api-python/app/modules/auth/**'
      - 'apps/api-python/app/modules/mobile/**'
      - 'apps/api-python/tests/contract/api/test_mobile_auth_contract.py'
      - 'apps/api-python/tests/contract/api/test_mobile_compatibility.py'
      - 'apps/api-python/tests/integration/modules/mobile/**'
      - 'apps/api-python/tests/test_route_coverage.py'
      - 'apps/api-python/tests/test_sqlite_database.py'
      - 'docs/adr/0006-native-mobile-kmp-boundaries.md'
      - 'docs/adr/0015-mobile-v1-verified-session-without-offline-mode.md'
      - 'docs/testing/test-execution-policy.md'
      - 'docs/manual-acceptance.md'
      - '.github/workflows/mobile.yml'
      - 'scripts/*android-beta*'
      - 'apps/web/public/brand/ermao-library-app-icon-v1.png'
      - 'apps/web/public/fonts/reader/android-legacy/**'
  workflow_dispatch:
    inputs:
      run_full_android_regression:
        description: Run the complete Android instrumented regression suite instead of the shell smoke test.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-stage-1-${{ github.ref }}
  # Never cancel a develop run while it may be updating the beta Release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  backend-contract:
    name: Backend mobile contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-python

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install RAR test adapter
        run: sudo apt-get update && sudo apt-get install --yes 7zip

      - name: Check mobile backend sources
        run: |
          uv run --extra dev --locked ruff format --check \
            app/api/router.py app/db/seed.py app/modules/mobile \
            tests/contract/api/test_mobile_auth_contract.py \
            tests/contract/api/test_mobile_compatibility.py \
            tests/integration/modules/mobile tests/test_route_coverage.py \
            tests/test_sqlite_database.py
          uv run --extra dev --locked ruff check \
            app/api/router.py app/db/seed.py app/modules/mobile \
            tests/contract/api/test_mobile_auth_contract.py \
            tests/contract/api/test_mobile_compatibility.py \
            tests/integration/modules/mobile tests/test_route_coverage.py \
            tests/test_sqlite_database.py
          uv run --extra dev --locked mypy --follow-imports=skip app/modules/mobile

      - name: Run mobile server and authentication contracts
        run: |
          uv run --extra dev --locked pytest -q \
            tests/contract/api/test_mobile_compatibility.py \
            tests/contract/api/test_mobile_auth_contract.py \
            --junitxml=mobile-contract-results.xml

      - name: Upload backend contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-backend-contract-results
          path: apps/api-python/mobile-contract-results.xml
          if-no-files-found: error

  android:
    name: Shared and Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Check approved iOS Readium baseline
        run: |
          python3 iosApp/verify_readium.py
          python3 -m unittest discover -s iosApp -p 'test_verify_readium.py'

      - name: Check generated Reader safety contract
        run: |
          python3 ../../packages/reader-contracts/generate-reader-safety-policy.py --check
          python3 ../../packages/reader-contracts/generate-reader-progress-timing.py --check
          python3 ../../packages/reader-contracts/check-reader-safety-boundaries.py
          python3 -m unittest discover \
            -s ../../packages/reader-contracts/tests -p 'test_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Verify accepted Android PDFium artifact
        run: python3 native/pdfium/scripts/verify-lock.py --platform android

      - name: Check source boundaries
        shell: bash
        run: |
          test ! -e package.json
          if find shared/src/commonMain -path '*/domain/*.kt' -print0 \
            | xargs -0 grep -nE '^import (android\.|java\.|io\.ktor\.|platform\.)'; then
            echo 'Domain code imports a platform or transport dependency.' >&2
            exit 1
          fi
          if find shared/src/commonMain -path '*/application/*.kt' -print0 \
            | xargs -0 grep -nE '^import .*\.infrastructure\.'; then
            echo 'Application code imports an infrastructure implementation.' >&2
            exit 1
          fi
          if git grep -nE '(android\.util\.Log|NSLog|(^|[[:space:]])(print|println))\(' -- \
            shared/src androidApp/src/main iosApp/ErmaoLibrary; then
            echo 'Production mobile source contains direct logging.' >&2
            exit 1
          fi

      - name: Install pinned host JNI compiler
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zig-0.14.1.tar.xz"
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz \
            --output "$archive"
          printf '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  %s\n' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "ERMAO_ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig" version

      - name: Test, lint, and assemble
        run: |
          ./gradlew --stacktrace \
            verifyMobileOfflineContract \
            verifyDesignTokens \
            :shared:testAndroidHostTest \
            :androidApp:testDebugUnitTest \
            :androidApp:lintDebug \
            :androidApp:assembleDebug

      - name: Check beta publishing policy
        run: node --test ../../scripts/android-beta-release.test.mjs

      - name: Assemble and lint unsigned beta
        run: ./gradlew --stacktrace :androidApp:assembleBeta :androidApp:lintBeta -PbetaBuildNumber=${{ github.run_number }}

      - name: Upload unsigned beta for this run
        uses: actions/upload-artifact@v4
        with:
          name: android-beta-unsigned
          path: apps/mobile/androidApp/build/outputs/apk/beta/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify executable KMP Reader safety report
        run: |
          python3 ../../packages/reader-contracts/verify-reader-safety-conformance.py \
            --require-consumer KMP \
            shared/build/reports/reader-safety-conformance/kmp.json

      - name: Upload Android build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ermao-library-android-results
          path: |
            apps/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            apps/mobile/androidApp/build/reports/lint-results-debug.html
            apps/mobile/androidApp/build/test-results/testDebugUnitTest/*.xml
            apps/mobile/shared/build/test-results/*/*.xml
            apps/mobile/shared/build/reports/reader-safety-conformance/*.json
          if-no-files-found: warn

  publish-android-beta:
    name: Publish Android beta
    needs: [backend-contract, android, android-emulator]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-beta-release
      cancel-in-progress: false
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6

      - name: Download this run's unsigned beta
        uses: actions/download-artifact@v4
        with:
          name: android-beta-unsigned
          path: unsigned-beta

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Sign and verify beta APK
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: bash scripts/sign-android-beta.sh unsigned-beta dist/android-beta

      - name: Update Android beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-beta.mjs dist/android-beta

  android-emulator:
    name: Android emulator smoke and safety conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      RUN_FULL_ANDROID_REGRESSION: ${{ inputs.run_full_android_regression || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify accepted Android PDFium artifact
        run: python3 native/pdfium/scripts/verify-lock.py --platform android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: bash scripts/run-android-emulator-tests.sh

      - name: Upload Android instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ermao-library-android-instrumented-results
          path: |
            apps/mobile/androidApp/build/reports/androidTests/manual/instrumentation.txt
            apps/mobile/androidApp/build/reports/androidTests/manual/startup-*.txt
            apps/mobile/androidApp/build/reports/androidTests/manual/startup-*.xml
            apps/mobile/androidApp/build/reports/reader-safety-conformance/android.json
          if-no-files-found: warn
