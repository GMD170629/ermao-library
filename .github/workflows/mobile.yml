name: Mobile Stage 1

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'docs/mobile-reader-architecture.md'
      - 'AGENTS.md'
      - '.cursor/rules/architecture.mdc'
      - 'apps/api-python/app/api/router.py'
      - 'apps/api-python/app/bootstrap/auth.py'
      - 'apps/api-python/app/contracts/http.py'
      - 'apps/api-python/app/contracts/http_errors.py'
      - 'apps/api-python/app/core/auth.py'
      - 'apps/api-python/app/core/authorization.py'
      - 'apps/api-python/app/db/seed.py'
      - 'apps/api-python/app/models/auth.py'
      - 'apps/api-python/app/modules/auth/**'
      - 'apps/api-python/app/modules/mobile/**'
      - 'apps/api-python/tests/contract/api/test_mobile_auth_contract.py'
      - 'apps/api-python/tests/contract/api/test_mobile_compatibility.py'
      - 'apps/api-python/tests/integration/modules/mobile/**'
      - 'apps/api-python/tests/test_route_coverage.py'
      - 'apps/api-python/tests/test_sqlite_database.py'
      - 'docs/adr/0006-native-mobile-kmp-boundaries.md'
      - 'docs/adr/0015-mobile-v1-verified-session-without-offline-mode.md'
      - 'docs/testing/mobile-stage-0-acceptance.md'
      - 'docs/testing/mobile-stage-1-acceptance.md'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - develop
      - prod
    paths:
      - 'apps/mobile/**'
      - 'docs/mobile-reader-architecture.md'
      - 'AGENTS.md'
      - '.cursor/rules/architecture.mdc'
      - 'apps/api-python/app/api/router.py'
      - 'apps/api-python/app/bootstrap/auth.py'
      - 'apps/api-python/app/contracts/http.py'
      - 'apps/api-python/app/contracts/http_errors.py'
      - 'apps/api-python/app/core/auth.py'
      - 'apps/api-python/app/core/authorization.py'
      - 'apps/api-python/app/db/seed.py'
      - 'apps/api-python/app/models/auth.py'
      - 'apps/api-python/app/modules/auth/**'
      - 'apps/api-python/app/modules/mobile/**'
      - 'apps/api-python/tests/contract/api/test_mobile_auth_contract.py'
      - 'apps/api-python/tests/contract/api/test_mobile_compatibility.py'
      - 'apps/api-python/tests/integration/modules/mobile/**'
      - 'apps/api-python/tests/test_route_coverage.py'
      - 'apps/api-python/tests/test_sqlite_database.py'
      - 'docs/adr/0006-native-mobile-kmp-boundaries.md'
      - 'docs/adr/0015-mobile-v1-verified-session-without-offline-mode.md'
      - 'docs/testing/mobile-stage-0-acceptance.md'
      - 'docs/testing/mobile-stage-1-acceptance.md'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      run_full_android_regression:
        description: Run the complete Android instrumented regression suite instead of the shell smoke test.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-stage-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Backend mobile contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-python

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install RAR test adapter
        run: sudo apt-get update && sudo apt-get install --yes 7zip

      - name: Check mobile backend sources
        run: |
          uv run --extra dev --locked ruff format --check \
            app/api/router.py app/db/seed.py app/modules/mobile \
            tests/contract/api/test_mobile_auth_contract.py \
            tests/contract/api/test_mobile_compatibility.py \
            tests/integration/modules/mobile tests/test_route_coverage.py \
            tests/test_sqlite_database.py
          uv run --extra dev --locked ruff check \
            app/api/router.py app/db/seed.py app/modules/mobile \
            tests/contract/api/test_mobile_auth_contract.py \
            tests/contract/api/test_mobile_compatibility.py \
            tests/integration/modules/mobile tests/test_route_coverage.py \
            tests/test_sqlite_database.py
          uv run --extra dev --locked mypy --follow-imports=skip app/modules/mobile

      - name: Run mobile server and authentication contracts
        run: |
          uv run --extra dev --locked pytest -q \
            tests/contract/api/test_mobile_compatibility.py \
            tests/contract/api/test_mobile_auth_contract.py \
            --junitxml=mobile-contract-results.xml

      - name: Upload backend contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-backend-contract-results
          path: apps/api-python/mobile-contract-results.xml
          if-no-files-found: error

  android:
    name: Shared and Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check approved iOS Readium baseline
        run: |
          python3 iosApp/verify_readium.py
          python3 -m unittest discover -s iosApp -p 'test_verify_readium.py'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Check source boundaries
        shell: bash
        run: |
          test ! -e package.json
          if find shared/src/commonMain -path '*/domain/*.kt' -print0 \
            | xargs -0 grep -nE '^import (android\.|java\.|io\.ktor\.|platform\.)'; then
            echo 'Domain code imports a platform or transport dependency.' >&2
            exit 1
          fi
          if find shared/src/commonMain -path '*/application/*.kt' -print0 \
            | xargs -0 grep -nE '^import .*\.infrastructure\.'; then
            echo 'Application code imports an infrastructure implementation.' >&2
            exit 1
          fi
          if git grep -nE '(android\.util\.Log|NSLog|(^|[[:space:]])(print|println))\(' -- \
            shared/src androidApp/src/main iosApp/ErmaoLibrary; then
            echo 'Production mobile source contains direct logging.' >&2
            exit 1
          fi

      - name: Test, lint, and assemble
        run: |
          ./gradlew --stacktrace \
            verifyMobileOfflineContract \
            verifyDesignTokens \
            :shared:testAndroidHostTest \
            :androidApp:testDebugUnitTest \
            :androidApp:lintDebug \
            :androidApp:assembleDebug

      - name: Upload Android build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ermao-library-android-results
          path: |
            apps/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            apps/mobile/androidApp/build/reports/lint-results-debug.html
            apps/mobile/androidApp/build/test-results/testDebugUnitTest/*.xml
            apps/mobile/shared/build/test-results/*/*.xml
          if-no-files-found: warn

  android-emulator:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      RUN_FULL_ANDROID_REGRESSION: ${{ inputs.run_full_android_regression || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: |
            set -euo pipefail
            if [ "$RUN_FULL_ANDROID_REGRESSION" = "true" ]; then
              ./gradlew :androidApp:connectedDebugAndroidTest :androidApp:assembleDebug
            else
              ./gradlew \
                :androidApp:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=com.ermao.library.AndroidShellSmokeTest \
                :androidApp:assembleDebug
            fi
            adb logcat -c
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            adb shell am force-stop com.ermao.library
            adb shell monkey -p com.ermao.library -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 20); do
              if adb shell pidof com.ermao.library | grep -q '[0-9]'; then
                break
              fi
              sleep 1
            done
            adb shell pidof com.ermao.library | grep -q '[0-9]'
            adb shell dumpsys package com.ermao.library | grep -q 'versionCode=1'
            adb shell dumpsys package com.ermao.library | grep -q 'versionName=1.0.0'
            app_ready=false
            for attempt in $(seq 1 20); do
              adb shell uiautomator dump /sdcard/mobile-stage-1.xml >/dev/null
              if adb shell cat /sdcard/mobile-stage-1.xml | grep -q 'Connect your library'; then
                app_ready=true
                break
              fi
              sleep 1
            done
            test "$app_ready" = true
            if adb logcat -d -b crash | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -b crash
              exit 1
            fi

      - name: Upload Android instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ermao-library-android-instrumented-results
          path: apps/mobile/androidApp/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
