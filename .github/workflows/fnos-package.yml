name: Build and release fnOS application package

on:
  pull_request:
    paths:
      - 'deploy/fnos/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/features/**'
      - 'apps/web/lib/**'
      - 'apps/web/public/icons/**'
      - 'apps/web/public/manifest.webmanifest'
      - 'apps/web/public/sw.js'
      - 'apps/web/Dockerfile.prod'
      - 'apps/web/next.config.js'
      - 'apps/api-python/app/core/**'
      - 'apps/api-python/app/db/**'
      - 'scripts/build-fnos-package.sh'
      - 'scripts/start-unified-app.sh'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - '.github/workflows/fnos-package.yml'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the package to a GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FNPACK_VERSION: '1.2.3'
  FNPACK_SHA256: '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93'

jobs:
  validate:
    name: Validate fnOS package templates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate fnOS package templates
        env:
          FNOS_VALIDATE_ONLY: 'true'
        run: scripts/build-fnos-package.sh

  package:
    name: Build fnOS FPK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and verify package version
        id: version
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          web_version="$(node -p "require('./apps/web/package.json').version")"
          python_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/api-python/pyproject.toml | head -n 1)"
          runtime_version="$(sed -n 's/^[[:space:]]*app_version: str = "\([^"]*\)"/\1/p' apps/api-python/app/core/config.py)"
          lock_version="$(awk '/^name = "shuku-starship-api-python"$/ { found=1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' apps/api-python/uv.lock)"
          for version_source in "$web_version" "$python_version" "$runtime_version" "$lock_version"; do
            if [[ "$version_source" != "$app_version" ]]; then
              echo "Application versions are inconsistent: root=$app_version web=$web_version python=$python_version runtime=$runtime_version lock=$lock_version" >&2
              exit 1
            fi
          done
          if [[ "${GITHUB_REF_TYPE}" == 'tag' && "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${app_version}" >&2
            exit 1
          fi
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${app_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test Python backend with production runtime version
        working-directory: apps/api-python
        run: uv run --extra dev --locked pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: gamersgu/shuku-starship-web
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.app_version }}
            type=raw,value=prod,enable=${{ github.ref_type == 'tag' || inputs.publish_release == true }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.publish_release == true }}

      - name: Build and push release Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=fnos-versioned-image
          cache-to: type=gha,mode=max,scope=fnos-versioned-image

      - name: Install official fnpack
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/fnpack" \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  $RUNNER_TEMP/fnpack" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fnpack" --help >/dev/null

      - name: Build fnOS package
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: scripts/build-fnos-package.sh

      - name: Upload fnOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuku-starship-fnos-${{ steps.version.outputs.app_version }}-all
          path: dist/fnos/*.fpk
          if-no-files-found: error

      - name: Publish fnOS package to GitHub Release
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/fnos/*.fpk --clobber
          else
            gh release create "$RELEASE_TAG" dist/fnos/*.fpk \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
