name: Build and release fnOS application package

on:
  pull_request:
    paths:
      - 'deploy/fnos/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/features/**'
      - 'apps/web/lib/**'
      - 'apps/web/public/icons/**'
      - 'apps/web/public/manifest.webmanifest'
      - 'apps/web/public/sw.js'
      - 'apps/web/Dockerfile.prod'
      - 'apps/web/next.config.js'
      - 'apps/api-python/app/core/**'
      - 'apps/api-python/app/db/**'
      - 'apps/api-python/pyproject.toml'
      - 'apps/api-python/uv.lock'
      - 'apps/web/package.json'
      - 'release-notes/**'
      - 'scripts/validate-release-notes.mjs'
      - 'scripts/validate-release-notes.test.mjs'
      - 'scripts/build-fnos-package.sh'
      - 'scripts/publish-docker-hub.sh'
      - 'scripts/start-unified-app.sh'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - '.github/workflows/fnos-package.yml'
      - '.github/workflows/sync-release-notes.yml'
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FNPACK_VERSION: '1.2.3'
  FNPACK_SHA256: '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93'

jobs:
  validate:
    name: Validate fnOS package templates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test strict bilingual release-note validation
        run: node --test scripts/validate-release-notes.test.mjs

      - name: Validate application version and bilingual release notes
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "origin/$BASE_REF")
          fi
          node scripts/validate-release-notes.mjs "${args[@]}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.12.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web quality gates
        run: |
          pnpm --filter @shuku/web lint
          pnpm --filter @shuku/web typecheck
          pnpm --filter @shuku/web test
          pnpm --filter @shuku/web i18n:check
          pnpm --filter @shuku/web build

      - name: Validate fnOS package templates
        env:
          FNOS_VALIDATE_ONLY: 'true'
        run: scripts/build-fnos-package.sh

  publish-prod-image:
    name: Publish prod Docker image
    if: github.ref == 'refs/heads/prod'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate application version and bilingual release notes
        run: node scripts/validate-release-notes.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push prod Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gamersgu/shuku-starship-web:prod
            gamersgu/shuku-starship-web:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,mode=max,scope=prod-image

  package:
    name: Build fnOS FPK
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/prod'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read and verify package version and bilingual release notes
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            node scripts/validate-release-notes.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/validate-release-notes.mjs
          fi

      - name: Prepare strict bilingual Draft Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == 'true' ]]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
          remote_body="$RUNNER_TEMP/prepared-release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$remote_body"
          node - "$RELEASE_NOTES_PATH" "$remote_body" <<'NODE'
          const fs = require('node:fs');
          const normalize = (value) => value.replace(/\r\n/g, '\n').replace(/\n?$/, '\n');
          const expected = normalize(fs.readFileSync(process.argv[2], 'utf8'));
          const actual = normalize(fs.readFileSync(process.argv[3], 'utf8'));
          if (expected !== actual) {
            console.error('Published GitHub Release body differs from the authoritative bilingual release note.');
            process.exit(1);
          }
          NODE

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test Python backend with production runtime version
        working-directory: apps/api-python
        run: uv run --extra dev --locked pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: gamersgu/shuku-starship-web
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.app_version }}
            type=raw,value=prod,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push release Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=fnos-versioned-image
          cache-to: type=gha,mode=max,scope=fnos-versioned-image

      - name: Install official fnpack
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/fnpack" \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  $RUNNER_TEMP/fnpack" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fnpack" --help >/dev/null

      - name: Build fnOS package
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: scripts/build-fnos-package.sh

      - name: Upload fnOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuku-starship-fnos-${{ steps.version.outputs.app_version }}-all
          path: dist/fnos/*.fpk
          if-no-files-found: error

      - name: Upload fnOS package to Draft Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/fnos/*.fpk --clobber

      - name: Verify and publish strict bilingual Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
        shell: bash
        run: |
          remote_body="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$remote_body"
          node - "$RELEASE_NOTES_PATH" "$remote_body" <<'NODE'
          const fs = require('node:fs');
          const normalize = (value) => value.replace(/\r\n/g, '\n').replace(/\n?$/, '\n');
          const expected = normalize(fs.readFileSync(process.argv[2], 'utf8'));
          const actual = normalize(fs.readFileSync(process.argv[3], 'utf8'));
          if (expected !== actual) {
            console.error('GitHub Release body differs from the authoritative bilingual release note.');
            process.exit(1);
          }
          NODE
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Publish verified release feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          published_tag="$(gh release view "$RELEASE_TAG" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Release $RELEASE_TAG is not published; refusing to update release-feed." >&2
            exit 1
          fi
          feed_root="$(mktemp -d)"
          cp -R release-notes/. "$feed_root/"
          touch "$feed_root/.nojekyll"
          git -C "$feed_root" init
          git -C "$feed_root" checkout -b release-feed
          git -C "$feed_root" config user.name github-actions
          git -C "$feed_root" config user.email github-actions@github.com
          git -C "$feed_root" add .
          git -C "$feed_root" commit -m "Publish release feed $RELEASE_TAG"
          git -C "$feed_root" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            release-feed
