name: Build and release fnOS application package

on:
  pull_request:
    paths:
      - 'deploy/fnos/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/features/**'
      - 'apps/web/lib/**'
      - 'apps/web/generated/**'
      - 'apps/web/styles/**'
      - 'apps/web/scripts/**'
      - 'apps/web/public/icons/**'
      - 'apps/web/public/manifest.webmanifest'
      - 'apps/web/public/sw.js'
      - 'apps/web/Dockerfile.prod'
      - 'apps/web/next.config.js'
      - 'apps/api-python/app/**'
      - 'apps/api-python/tests/**'
      - 'apps/api-python/tests/conformance/**'
      - 'apps/api-python/pyproject.toml'
      - 'apps/api-python/uv.lock'
      - 'apps/web/package.json'
      - 'packages/reader-contracts/**'
      - 'packages/reader-core/**'
      - 'packages/design-contracts/**'
      - 'pnpm-lock.yaml'
      - '.gitmodules'
      - 'third_party/foliate-js/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'release-notes/**'
      - 'scripts/validate-release-notes.mjs'
      - 'scripts/validate-release-notes.test.mjs'
      - 'scripts/build-fnos-package.sh'
      - 'scripts/sign-android-apk.sh'
      - 'scripts/validate-release-assets*'
      - 'scripts/*app-packages*'
      - 'scripts/ghcr-updates*'
      - 'scripts/assemble-release-feed*'
      - 'scripts/build-application-package.py'
      - 'scripts/validate-release-source*'
      - 'scripts/release-mode*'
      - 'scripts/release-request*'
      - 'scripts/build-code-only-app.py'
      - 'scripts/accept_candidate_update.py'
      - 'scripts/test_accept_candidate_update.py'
      - 'scripts/accept_container_update.py'
      - 'scripts/container_update_*'
      - 'scripts/release-workflow-policy.test.mjs'
      - 'scripts/test_fnos_installation.py'
      - 'scripts/publish-docker-hub.sh'
      - 'scripts/start-unified-app.sh'
      - 'scripts/container-entry.py'
      - 'scripts/test_container*.py'
      - 'scripts/smoke-container-runtime.py'
      - 'scripts/fixtures/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - '.github/workflows/fnos-package.yml'
      - '.github/workflows/sync-release-notes.yml'
  push:
    branches:
      - prod
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# A release waiting for device acceptance must not be replaced by another release.
concurrency:
  group: fnos-${{ github.ref_type == 'tag' && 'stable-release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FNPACK_VERSION: '1.2.3'
  FNPACK_SHA256: '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93'

jobs:
  validate:
    name: Validate fnOS package templates
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_mode: ${{ steps.mode.outputs.release_mode }}
      runtime_image: ${{ steps.mode.outputs.runtime_image }}
      seed_version: ${{ steps.mode.outputs.seed_version }}
      base_version: ${{ steps.mode.outputs.base_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve committed release mode and verify baseline
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-mode.mjs --published-base

      - name: Validate release entry point and synchronized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-release-source.mjs

      - name: Test strict bilingual release-note validation
        run: node --test scripts/release-request.test.mjs scripts/release-mode.test.mjs scripts/ghcr-updates.test.mjs scripts/validate-release-notes.test.mjs scripts/validate-release-assets.test.mjs scripts/release-workflow-policy.test.mjs scripts/validate-release-source.test.mjs scripts/assemble-release-feed.test.mjs scripts/build-release-app-packages.test.mjs

      - name: Test candidate platform selection
        run: python3 -m unittest discover -s scripts -p 'test_accept_candidate_update.py'

      - name: Validate application version and bilingual release notes
        id: version
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "origin/$BASE_REF")
          fi
          node scripts/validate-release-notes.mjs "${args[@]}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.12.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for production Reader safety conformance
        if: steps.mode.outputs.release_mode != 'code-only'
        run: pnpm --filter @shuku/web exec playwright install --with-deps chromium webkit

      - name: Run Web quality gates
        if: steps.mode.outputs.release_mode != 'code-only'
        run: |
          pnpm --filter @shuku/web lint
          pnpm --filter @shuku/web typecheck
          pnpm --filter @shuku/web test
          pnpm --filter @shuku/web i18n:check
          pnpm --filter @shuku/web build

      - name: Check quick-update Web module
        if: steps.mode.outputs.release_mode == 'code-only'
        run: |
          pnpm --filter @shuku/web lint
          pnpm --filter @shuku/web typecheck
          pnpm --filter @shuku/web i18n:check
          cd apps/web
          pnpm exec tsx --test features/updates/application/confirm-update.test.ts features/updates/model/release-notes.test.ts

      - name: Set up Python for backend Reader conformance
        if: steps.mode.outputs.release_mode != 'code-only'
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        if: steps.mode.outputs.release_mode != 'code-only'
        uses: astral-sh/setup-uv@v6

      - name: Compare executable Reader safety reports
        if: steps.mode.outputs.release_mode != 'code-only'
        run: |
          pnpm --filter @shuku/web conformance:reader-safety
          uv run --project apps/api-python --locked python apps/api-python/tests/conformance/reader_safety_conformance.py \
            --output artifacts/reader-safety-conformance/backend.json
          python3 packages/reader-contracts/verify-reader-safety-conformance.py \
            --require-consumer BACKEND \
            --require-consumer WEB \
            artifacts/reader-safety-conformance/backend.json \
            artifacts/reader-safety-conformance/web.json

      - name: Upload Reader safety reports
        if: always() && steps.mode.outputs.release_mode != 'code-only'
        uses: actions/upload-artifact@v4
        with:
          name: reader-safety-web-backend-conformance
          path: artifacts/reader-safety-conformance/*.json
          if-no-files-found: error

      - name: Validate fnOS package templates
        if: steps.mode.outputs.release_mode != 'code-only'
        env:
          FNOS_VALIDATE_ONLY: 'true'
        run: bash scripts/build-fnos-package.sh

  publish-prod-image:
    name: Publish prod Docker image
    if: github.ref == 'refs/heads/prod' && needs.validate.outputs.release_mode != 'code-only'
    needs: [validate, startup-acceptance]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate application version and bilingual release notes
        run: node scripts/validate-release-notes.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push prod Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gamersgu/shuku-starship-web:prod
            gamersgu/shuku-starship-web:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,mode=max,scope=prod-image

  startup-acceptance:
    name: Verify real server startup fault boundaries
    needs: validate
    if: needs.validate.outputs.release_mode != 'code-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Test supervisor with real child processes
        run: |
          python3 -m unittest discover -s scripts -p 'test_container_entry.py'
          python3 -m unittest discover -s scripts -p 'test_container_install.py'
          python3 -m unittest discover -s scripts -p 'test_container_image.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64
          load: true
          tags: shuku-startup:candidate
          cache-from: type=gha,scope=startup-acceptance
          cache-to: type=gha,mode=max,scope=startup-acceptance
      - name: Verify actual image startup, recovery, crash isolation and core refusal
        run: |
          python3 scripts/smoke-container-runtime.py --image shuku-startup:candidate --fault-boundaries
          python3 scripts/smoke-container-runtime.py --image shuku-startup:candidate --update-boundaries
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-acceptance
          path: artifacts/startup-acceptance

  publish-develop-image:
    name: Publish develop Docker image
    if: github.ref == 'refs/heads/develop' && needs.validate.outputs.release_mode != 'code-only'
    needs: [validate, startup-acceptance]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push develop Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64
          push: true
          tags: gamersgu/shuku-starship-web:develop
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=develop-image
          cache-to: type=gha,mode=max,scope=develop-image

  mobile-release:
    # v1.0.3, v1.0.4, v1.1.0 and v1.2.0 are owner-approved server-only releases; other tags retain mobile gates.
    if: github.ref_type == 'tag' && needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version)
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/mobile.yml
    with:
      stable_release: true
      # Stable releases use the existing smoke/safety checks plus owner device acceptance.
      # The optional full UI suite remains available from the mobile workflow.
      run_full_android_regression: false

  package:
    name: Build selected release artifacts
    if: always() && needs.validate.result == 'success' && (needs.validate.outputs.release_mode == 'code-only' || needs.mobile-release.result == 'success' || (contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) && needs.mobile-release.result == 'skipped')) && github.ref_type == 'tag'
    needs: [validate, mobile-release]
    outputs:
      image_digest: ${{ steps.release_image.outputs.digest }}
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read and verify package version and bilingual release notes
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            node scripts/validate-release-notes.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/validate-release-notes.mjs
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api-python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Test Python backend with production runtime version
        if: needs.validate.outputs.release_mode != 'code-only'
        # The production image builds this same native library; host tests need it too.
        # Keep this prerequisite before pytest instead of replacing chapter adapters.
        working-directory: apps/api-python
        run: |
          command -v uv
          uv --version
          cmake -S ../../packages/reader-core/native/chapters -B ../../packages/reader-core/native/chapters/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../../packages/reader-core/native/chapters/build --config Release
          ctest --test-dir ../../packages/reader-core/native/chapters/build -C Release --output-on-failure
          uv run --extra dev --locked pytest -q

      - name: Download checked stable Android APK
        if: ${{ needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) }}
        uses: actions/download-artifact@v4
        with:
          name: android-stable-unsigned
          path: unsigned-android

      - name: Set up JDK for stable signing
        if: ${{ needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for stable signing
        if: ${{ needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) }}
        uses: android-actions/setup-android@v3

      - name: Install signing tools
        if: ${{ needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) }}
        run: sdkmanager 'build-tools;36.0.0'

      - name: Sign and verify stable Android APK
        if: ${{ needs.validate.outputs.release_mode != 'code-only' && !contains(fromJSON('["1.0.3","1.0.4","1.1.0","1.2.0"]'), needs.validate.outputs.app_version) }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash scripts/sign-android-apk.sh unsigned-android dist/android stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.validate.outputs.release_mode != 'code-only'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        if: needs.validate.outputs.release_mode != 'code-only'
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: gamersgu/shuku-starship-web
          flavor: latest=false
          tags: |
            type=raw,value=release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build and push release Docker image
        if: needs.validate.outputs.release_mode != 'code-only'
        id: release_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=fnos-versioned-image
          cache-to: type=gha,mode=max,scope=fnos-versioned-image

      - name: Build and validate applications from the exact target environments
        if: needs.validate.outputs.release_mode != 'code-only'
        env:
          IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: bash scripts/build-release-app-packages.sh "gamersgu/shuku-starship-web@$IMAGE_DIGEST" dist/application

      - name: Accept the exact server release image before publication
        if: needs.validate.outputs.release_mode != 'code-only'
        env:
          IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          python3 scripts/smoke-container-runtime.py --image "gamersgu/shuku-starship-web@$IMAGE_DIGEST" --fault-boundaries
          python3 scripts/smoke-container-runtime.py --image "gamersgu/shuku-starship-web@$IMAGE_DIGEST" --update-boundaries

      - name: Preserve exact release startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-startup-acceptance
          path: artifacts/startup-acceptance

      - name: Install official fnpack
        if: needs.validate.outputs.release_mode != 'code-only'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/fnpack" \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  $RUNNER_TEMP/fnpack" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fnpack" --help >/dev/null

      - name: Build fnOS package
        if: needs.validate.outputs.release_mode != 'code-only'
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: scripts/build-fnos-package.sh

      - name: Hash fnOS packages
        if: needs.validate.outputs.release_mode != 'code-only'
        run: |
          cd dist/fnos
          for package in *.fpk; do sha256sum "$package" > "$package.sha256"; done

      - name: Build code-only applications in existing runtimes
        if: needs.validate.outputs.release_mode == 'code-only'
        env:
          RUNTIME_IMAGE: ${{ needs.validate.outputs.runtime_image }}
          SEED_VERSION: ${{ needs.validate.outputs.seed_version }}
        run: bash scripts/build-release-app-packages.sh "$RUNTIME_IMAGE" dist/application code-only "$SEED_VERSION"

      - name: Validate complete release bundle
        run: node scripts/validate-release-assets.mjs dist '${{ steps.version.outputs.release_tag }}'

      - name: Upload complete release bundle artifact
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: ermao-library-${{ steps.version.outputs.app_version }}-${{ github.run_id }}-${{ github.run_attempt }}-bundle
          path: dist
          if-no-files-found: error

  publish:
    name: Publish verified release artifacts
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.package.result == 'success' && github.ref_type == 'tag' }}
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v6

      - name: Read and verify release version
        id: version
        run: node scripts/validate-release-notes.mjs --tag "${GITHUB_REF_NAME}"

      - name: Download the verified bundle from this build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_id }}
          merge-multiple: true
          path: dist

      - name: Verify downloaded release bundle
        run: node scripts/validate-release-assets.mjs dist '${{ steps.version.outputs.release_tag }}'

      - name: Set up Docker Buildx for digest promotion
        if: needs.validate.outputs.release_mode != 'code-only'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.validate.outputs.release_mode != 'code-only'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish and anonymously verify OCI update artifacts
        if: github.ref_type == 'tag'
        run: node scripts/ghcr-updates.mjs dist/application '${{ steps.version.outputs.app_version }}'

      - name: Prepare strict bilingual Draft Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == 'true' ]]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
          remote_body="$RUNNER_TEMP/prepared-release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$remote_body"
          node - "$RELEASE_NOTES_PATH" "$remote_body" <<'NODE'
          const fs = require('node:fs');
                const normalize = (value) => value.replace(/\r\n/g, '\n').replace(/\n*$/, '\n');
          const expected = normalize(fs.readFileSync(process.argv[2], 'utf8'));
          const actual = normalize(fs.readFileSync(process.argv[3], 'utf8'));
          if (expected !== actual) {
            console.error('Published GitHub Release body differs from the authoritative bilingual release note.');
            process.exit(1);
          }
          NODE

      - name: Upload complete APK and fnOS bundle to Draft Release
        if: github.ref_type == 'tag' && needs.validate.outputs.release_mode != 'code-only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          node scripts/validate-release-assets.mjs dist "$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == 'v1.0.3' || "$RELEASE_TAG" == 'v1.0.4' || "$RELEASE_TAG" == 'v1.1.0' || "$RELEASE_TAG" == 'v1.2.0' ]]; then
            gh release upload "$RELEASE_TAG" dist/fnos/*.fpk dist/fnos/*.sha256 --clobber
          else
            gh release upload "$RELEASE_TAG" dist/fnos/*.fpk dist/fnos/*.sha256 dist/android/*.apk dist/android/*.sha256 --clobber
          fi
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node scripts/validate-release-assets.mjs dist "$RELEASE_TAG" "$RUNNER_TEMP/release-assets.json"

      - name: Verify quick Release has no installer attachments
        if: needs.validate.outputs.release_mode == 'code-only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node scripts/validate-release-assets.mjs dist "$RELEASE_TAG" "$RUNNER_TEMP/release-assets.json"

      - name: Promote verified release Docker image
        if: github.ref_type == 'tag' && needs.validate.outputs.release_mode != 'code-only'
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          IMAGE_DIGEST: ${{ needs.package.outputs.image_digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Missing or invalid build digest' >&2; exit 1; }
          docker buildx imagetools create \
            --tag "gamersgu/shuku-starship-web:$APP_VERSION" \
            --tag gamersgu/shuku-starship-web:prod \
            --tag gamersgu/shuku-starship-web:latest \
            "gamersgu/shuku-starship-web@$IMAGE_DIGEST"

      - name: Verify and publish strict bilingual Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
        shell: bash
        run: |
          remote_body="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$remote_body"
          node - "$RELEASE_NOTES_PATH" "$remote_body" <<'NODE'
          const fs = require('node:fs');
                const normalize = (value) => value.replace(/\r\n/g, '\n').replace(/\n*$/, '\n');
          const expected = normalize(fs.readFileSync(process.argv[2], 'utf8'));
          const actual = normalize(fs.readFileSync(process.argv[3], 'utf8'));
          if (expected !== actual) {
            console.error('GitHub Release body differs from the authoritative bilingual release note.');
            process.exit(1);
          }
          NODE
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Publish verified release feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          published_tag="$(gh release view "$RELEASE_TAG" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Release $RELEASE_TAG is not published; refusing to update release-feed." >&2
            exit 1
          fi
          feed_root="$(mktemp -d)"
          cp -R release-notes/. "$feed_root/"
          node scripts/assemble-release-feed.mjs "$feed_root/index.json"
          touch "$feed_root/.nojekyll"
          git -C "$feed_root" init
          git -C "$feed_root" checkout -b release-feed
          git -C "$feed_root" config user.name github-actions
          git -C "$feed_root" config user.email github-actions@github.com
          git -C "$feed_root" add .
          git -C "$feed_root" commit -m "Publish release feed $RELEASE_TAG"
          git -C "$feed_root" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            release-feed
