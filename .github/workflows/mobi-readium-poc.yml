name: mobi-readium-poc

on:
  push:
    branches:
      - poc/libmobi-readium
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libmobi 0.12
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.12 https://github.com/bfabiszewski/libmobi.git /tmp/libmobi
          cmake -S /tmp/libmobi -B /tmp/libmobi-build \
            -DUSE_LIBXML2=OFF \
            -DUSE_ZLIB=ON \
            -DUSE_XMLWRITER=OFF \
            -DUSE_ENCRYPTION=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/libmobi-build --target mobitool --parallel 2
          /tmp/libmobi-build/tools/mobitool -v

      - name: Parse real KF8/MOBI test corpus into source resources
        shell: bash
        run: |
          set -euxo pipefail
          TOOL=/tmp/libmobi-build/tools/mobitool
          mkdir -p /tmp/mobi-output
          for book in \
            /tmp/libmobi/tests/samples/sample-ncx.mobi \
            /tmp/libmobi/tests/samples/sample-unicode-huffdic.mobi \
            /tmp/libmobi/tests/samples/sample-multimedia.mobi \
            /tmp/libmobi/tests/samples/sample-obfuscated-fonts.mobi
          do
            echo "===== $book ====="
            "$TOOL" -i "$book" | tee -a /tmp/mobi-metadata.txt
            out="/tmp/mobi-output/$(basename "$book" .mobi)"
            mkdir -p "$out"
            "$TOOL" -s -o "$out" "$book"
            find "$out" -maxdepth 3 -type f -print
          done
          grep -F 'file version: 8' /tmp/mobi-metadata.txt
          find /tmp/mobi-output -type f | grep -E '\.(html|xhtml|htm|css|jpg|jpeg|png|gif|svg|ttf|otf|woff|woff2)$' > /tmp/mobi-resources.txt
          test -s /tmp/mobi-resources.txt
          cat /tmp/mobi-resources.txt

      - name: Package exact libmobi KF8 output into instrumentation APK
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/tmp/mobi-output/sample-obfuscated-fonts/sample-obfuscated-fonts_markup
          DST=experiments/mobi-readium-poc/android/app/src/androidTest/assets/mobi
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -av "$SRC"/. "$DST"/
          test -s "$DST/part00000.html"
          test -s "$DST/flow00001.css"
          test -s "$DST/resource00000.otf"
          echo '--- exact libmobi files fed to Readium ---'
          find "$DST" -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Check Readium 3.3 runtime Publication contract
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 3.3.0 https://github.com/readium/kotlin-toolkit.git /tmp/readium
          FACTORY=/tmp/readium/readium/navigator/src/main/java/org/readium/r2/navigator/epub/EpubNavigatorFactory.kt
          SERVER=/tmp/readium/readium/navigator/src/main/java/org/readium/r2/navigator/epub/WebViewServer.kt
          PUBLICATION=/tmp/readium/readium/shared/src/main/java/org/readium/r2/shared/publication/Publication.kt
          MANIFEST=/tmp/readium/readium/shared/src/main/java/org/readium/r2/shared/publication/Manifest.kt
          grep -F 'private val publication: Publication' "$FACTORY"
          grep -F 'publication' "$SERVER" | grep -F '.get('
          grep -F 'publication.conformsTo(Publication.Profile.EPUB)' "$SERVER"
          grep -F 'public val container: Container<Resource>' "$PUBLICATION"
          grep -F 'readingOrder.allAreHtml && metadata.conformsTo.contains(Publication.Profile.EPUB)' "$MANIFEST"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compile instrumentation proof
        working-directory: experiments/mobi-readium-poc/android
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          sudo usermod -aG kvm "$USER" || true
          sudo chown "$USER" /dev/kvm || true

      - name: Run real EPUB Navigator render proof on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd experiments/mobi-readium-poc/android && gradle :app:connectedDebugAndroidTest --stacktrace
